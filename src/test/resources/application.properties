spring.application.name=recommendation-service

# Config H2 database in memory
application.recommendations-db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/v1/changelog-master.yaml
