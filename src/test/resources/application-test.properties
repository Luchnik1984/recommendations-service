# ==================== APPLICATION SETTINGS ====================
spring.application.name=recommendation-service-test
server.port=${SERVER_PORT:8080}

# ==================== H2 TRANSACTION DATABASE ====================
application.recommendations-db.url=jdbc:h2:mem:test_transactions;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ==================== DYNAMIC RULES DATABASE (H2 EMULATION) ====================
spring.datasource.url=jdbc:h2:mem:dynamic_rules_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==================== LIQUIBASE CONFIG ====================

# ENABLE Liquibase for transaction database
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/v1/changelog-master.yaml

# Liquibase should use the DataSource of transactional database
spring.liquibase.url=${application.recommendations-db.url}
spring.liquibase.user=sa
spring.liquibase.password=

# Different table names Liquibase
spring.liquibase.database-change-log-table=TEST_TRANSACTIONS_CHANGELOG
spring.liquibase.database-change-log-lock-table=TEST_TRANSACTIONS_CHANGELOG_LOCK

# ==================== JPA & HIBERNATE SETTINGS ====================
# For JPA dynamic_rules_test use Hibernate, NOT Liquibase
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# EXPLICITLY disabling Liquibase for JPA via a separate property
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==================== LOGGING ====================
logging.level.org.skypro.bank.star.recommendations_service=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.liquibase=DEBUG

# ==================== TEST-SPECIFIC SETTINGS ====================
spring.jmx.enabled=false