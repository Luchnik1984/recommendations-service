#============================================================
# TEST CONFIGURATION - EXACT COPY OF application.properties
#============================================================

spring.application.name=recommendation-service

# Server settings
server.port=${SERVER_PORT:8080}

# Active profiles (can be overridden by SPRING_PROFILES_ACTIVE env variable)
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}

#============================================================

# Config H2 Read-only database (IN-MEMORY FOR TESTS)
application.recommendations-db.url=${H2_DATABASE_URL:jdbc:h2:mem:test_transactions;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
application.recommendations-db.driver-class-name=org.h2.Driver

# Disable automatic initialization of the Spring Boot database
spring.sql.init.mode=never

# H2 Console settings (enabled for debugging tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#============================================================

# Config Read-Write PostgreSQL database (TEST INSTANCE)
spring.datasource.driver-class-name=org.postgresql.Driver

# URL, username, password will be loaded from configuration.env.test
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/dynamic_rules_test}
spring.datasource.username=${POSTGRES_USERNAME:test_user}
spring.datasource.password=${POSTGRES_PASSWORD:test_password}

# Connection pool settings (SAME AS MAIN)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

#============================================================

# JPA & HIBERNATE settings (EXACT COPY FROM MAIN)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#============================================================

# LIQUIBASE - STRUCTURE MIGRATIONS (FROM MAIN)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/dynamic-rules/changelog-master.yaml

#============================================================

# TEST-SPECIFIC SETTINGS
spring.main.allow-bean-definition-overriding=true

#============================================================

# Logging Configuration (more verbose for tests)
logging.level.org.skypro.bank.star.recommendations_service=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.liquibase=INFO
logging.level.com.zaxxer.hikari=DEBUG