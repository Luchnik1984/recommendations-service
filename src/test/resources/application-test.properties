# ==================== APPLICATION SETTINGS ====================
spring.application.name=recommendation-service-test
server.port=${SERVER_PORT:8080}

# ==================== H2 TRANSACTION DATABASE ====================
# Используем существующий бин, но с тестовым URL
application.recommendations-db.url=jdbc:h2:mem:test_transactions;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ==================== DYNAMIC RULES DATABASE (H2 EMULATION) ====================
# Используем существующий бин, но с тестовым URL
spring.datasource.url=jdbc:h2:mem:dynamic_rules_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==================== JPA & HIBERNATE SETTINGS ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ==================== LIQUIBASE CONFIGURATION ====================
# Основной Liquibase для транзакций
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/v1/changelog-master.yaml

# Второй Liquibase для динамических правил
spring.liquibase.dynamic-rules.enabled=true
spring.liquibase.dynamic-rules.change-log=classpath:db/changelog/test-data/changelog-master.yaml

# ==================== LOGGING ====================
logging.level.org.skypro.bank.star.recommendations_service=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.liquibase=INFO

# ==================== TEST-SPECIFIC SETTINGS ====================
spring.jmx.enabled=false