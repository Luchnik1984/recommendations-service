#============================================================
# TEST CONFIGURATION FOR REAL DATABASE CONNECTION
#============================================================

spring.application.name=recommendation-service

# PostgreSQL Database (real connection) - from configuration.env
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/dynamic_rules}
spring.datasource.username=${POSTGRES_USERNAME:dr}
spring.datasource.password=${POSTGRES_PASSWORD:QY}
spring.datasource.driver-class-name=org.postgresql.Driver


# H2 Console (debugging)
spring.h2.console.enabled=true

# JPA properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false



# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/dynamic-rules/changelog-master.yaml

# Logging for tests
logging.level.org.skypro.bank.star.recommendations_service=INFO
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.zaxxer.hikari=INFO

